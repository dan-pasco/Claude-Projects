<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0b1026; /* same dark night sky as the Hurray page */
    }
    button {
      font-size: 2rem;
      font-weight: bold;
      padding: 16px 40px;
      color: #fff;
      background: #2563eb;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <button id="helloButton">Hello Dan</button>

  <script>
    // When the button is clicked, go to the Hurray page
    const helloButton = document.getElementById("helloButton");

    helloButton.addEventListener("click", function () {
      window.location.href = "hurray.html";
    });
  </script>
</body>
</html>
