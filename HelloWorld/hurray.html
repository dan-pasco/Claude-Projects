<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hurray</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #0b1026; /* dark night sky so fireworks stand out */
      overflow: hidden;
    }
    /* The canvas covers the whole screen; fireworks are drawn on it */
    #fireworks {
      position: fixed;
      inset: 0;
    }
    /* Text sits on top of the canvas */
    h1, a {
      position: relative;
      z-index: 1;
    }
    h1 {
      font-size: 5rem;
      margin: 0 0 16px;
      color: #facc15;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.7);
      animation: pop 0.6s ease-out;
    }
    a {
      color: #93c5fd;
    }
    /* Makes the text "pop" in when the page loads */
    @keyframes pop {
      0%   { transform: scale(0.2); opacity: 0; }
      70%  { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <h1 id="hurrayText">Hurray!</h1>
  <a href="index.html">Go back</a>

  <script>
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    const text = document.getElementById("hurrayText");

    const colors = ["#f43f5e", "#facc15", "#22c55e", "#3b82f6", "#a855f7", "#f97316", "#ffffff"];
    let particles = [];

    // Keep the canvas the same size as the window
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Make one firework explosion at point (x, y)
    function explode(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      const count = 60;

      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;  // spread sparks in a circle
        const speed = 2 + Math.random() * 4;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,  // sideways speed
          vy: Math.sin(angle) * speed,  // up/down speed
          life: 1,                      // 1 = fully visible, 0 = gone
          color: color
        });
      }
    }

    // Pick a random spot around the edge of the Hurray text and explode there
    function launchFromText() {
      const box = text.getBoundingClientRect();
      const x = box.left + Math.random() * box.width;
      const y = box.top + Math.random() * box.height;
      explode(x, y);
    }

    // Draw every frame (about 60 times a second)
    function animate() {
      // Paint a see-through layer over the last frame to leave fading trails
      ctx.fillStyle = "rgba(11, 16, 38, 0.2)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(function (p) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;    // gravity pulls sparks down
        p.vx *= 0.98;    // air slows them a little
        p.vy *= 0.98;
        p.life -= 0.012; // slowly fade out

        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Remove sparks that have faded away
      particles = particles.filter(function (p) { return p.life > 0; });

      requestAnimationFrame(animate);
    }

    // Start: a big burst right away, then a new firework every 0.4 seconds
    for (let i = 0; i < 5; i++) launchFromText();
    const fireworksTimer = setInterval(launchFromText, 400);
    animate();

    // Stop launching new fireworks after 2 seconds (2,000 milliseconds).
    // Sparks already in the air finish fading out on their own.
    setTimeout(function () {
      clearInterval(fireworksTimer);
    }, 2000);
  </script>
</body>
</html>
